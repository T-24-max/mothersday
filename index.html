<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>母亲节快乐 ❤️ 献给最爱的妈妈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ========= 开始覆盖层 - 手机全屏适配、完整显示 ========= */
        #startOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #ff9a9e 0%, #fecfef 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            transition: opacity 1s ease;
            padding: 20px;
            box-sizing: border-box;
        }

        #startOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 卡片容器 - 完美适配手机屏幕 */
        .start-card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 56px;
            padding: 40px 24px 50px 24px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(2px);
        }

        /* 爱心标题 - 完整显示 */
        .heart-title {
            font-size: clamp(2.2rem, 10vw, 4rem);
            line-height: 1.3;
            margin-bottom: 16px;
            color: #c44569;
        }

        /* 感谢妈妈文字 */
        .thanks-mom {
            font-size: clamp(1.2rem, 6vw, 1.8rem);
            font-weight: 600;
            color: #e66767;
            margin: 20px 0 16px 0;
            padding: 0 8px;
        }

        /* 网址 */
        .site-url {
            font-size: 0.8rem;
            color: #b3405c;
            background: #fff0f3;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 40px;
            margin: 15px auto 20px;
            word-break: break-all;
        }

        /* 点击开始按钮 */
        .start-btn {
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            border: none;
            color: white;
            font-size: clamp(1.2rem, 6vw, 1.8rem);
            font-weight: bold;
            padding: 14px 32px;
            border-radius: 60px;
            margin: 15px auto 10px;
            display: inline-block;
            cursor: pointer;
            box-shadow: 0 6px 0 #a12a3e;
            transition: 0.1s linear;
            min-width: 200px;
            letter-spacing: 2px;
        }

        .start-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #a12a3e;
        }

        /* 献给最爱的妈妈 */
        .dedicate {
            font-size: clamp(0.9rem, 4vw, 1.2rem);
            color: #b83b5e;
            margin-top: 28px;
            border-top: 1px dashed #ffb7c5;
            padding-top: 22px;
            font-style: italic;
        }

        /* 底部提示（音乐） */
        #hintText {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 182, 193, 0.8);
            font-size: 12px;
            letter-spacing: 1px;
            z-index: 999;
            white-space: nowrap;
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 20px;
            pointer-events: none;
        }

        /* 音量控制 */
        #volumeControl {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        #volumeControl.show {
            opacity: 1;
            transform: translateY(0);
        }

        #volumeIcon {
            font-size: 20px;
            cursor: pointer;
            user-select: none;
        }

        #volumeSlider {
            width: 70px;
            height: 4px;
            accent-color: #ff69b4;
            cursor: pointer;
        }

        /* 手机超小屏优化 */
        @media (max-width: 450px) {
            .start-card {
                padding: 30px 20px 40px 20px;
                border-radius: 40px;
            }
            .start-btn {
                min-width: 160px;
                padding: 12px 24px;
            }
            #hintText {
                font-size: 10px;
                bottom: 12px;
                white-space: nowrap;
            }
            #volumeControl {
                bottom: 12px;
                right: 12px;
                padding: 6px 12px;
            }
            #volumeSlider {
                width: 55px;
            }
        }
    </style>
</head>
<body>
    <!-- Canvas画布 -->
    <canvas id="canvas"></canvas>

    <!-- 开始覆盖层 - 美化后的手机完整显示界面 -->
    <div id="startOverlay">
        <div class="start-card">
            <div class="heart-title">
                ❤️ 母亲节快乐 ❤️
            </div>
            <button class="start-btn" id="startBtn">
                ✨ 点击开始 ✨
            </button>
            <div class="dedicate">
                🌷 献给最爱的妈妈 🌷
            </div>
        </div>
        <p id="startHint" style="display:none;">✨ 献给最爱的妈妈 ✨</p>
    </div>

    <!-- 底部提示 -->
    <div id="hintText">🎵 《陪我长大》- 段奥娟 🎵</div>

    <!-- 音量控制 -->
    <div id="volumeControl">
        <span id="volumeIcon">🔊</span>
        <input type="number" id="volumeSlider" min="0" max="100" value="60" style="display:none;">
        <!-- 改为 range 类型，更兼容 -->
        <input type="range" id="volumeSliderRange" min="0" max="100" value="60">
    </div>

    <script>
        // =========================
        // 🎵 音频系统 —— 使用《陪我长大》
        // =========================
        let bgMusic = null;
        let musicStarted = false;

        function initAudio() {
            bgMusic = new Audio('music.mp3');
            bgMusic.loop = true;
            bgMusic.volume = 0.6;
            
            bgMusic.addEventListener('error', (e) => {
                console.error('音乐文件加载失败！请确认 music.mp3 文件存在。');
            });

            bgMusic.play().then(() => {
                console.log('🎵 音乐开始播放：《陪我长大》');
            }).catch(err => {
                console.log('播放失败，可能需要用户手动触发:', err);
            });
        }

        // =========================
        // 初始化 Canvas
        // =========================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 设置画布实际分辨率
        const WIDTH = 1200;
        const HEIGHT = 800;
        canvas.width = WIDTH;
        canvas.height = HEIGHT;

        function resizeCanvas() {
            const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
            canvas.style.width = WIDTH * scale + 'px';
            canvas.style.height = HEIGHT * scale + 'px';
            canvas.style.position = 'fixed';
            canvas.style.top = '50%';
            canvas.style.left = '50%';
            canvas.style.transform = 'translate(-50%, -50%)';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // =========================
        // 颜色常量
        // =========================
        const BLACK = '#000000';
        const WHITE = '#ffffff';
        const LIGHT_PINK = '#ffc8dc';

        // =========================
        // LOVEYOU 字符流
        // =========================
        const letters = "LOVEYOU";
        const streams = [];
        for (let i = 0; i < 180; i++) {
            streams.push({
                x: Math.random() * WIDTH,
                y: Math.random() * HEIGHT * 2 - HEIGHT,
                speed: 1.5 + Math.random() * 2.5,
                size: 10 + Math.random() * 8,
                length: 8 + Math.floor(Math.random() * 13)
            });
        }

        function drawMatrixRain(timestamp) {
            streams.forEach(s => {
                ctx.font = `bold ${s.size}px Consolas, monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';

                for (let i = 0; i < s.length; i++) {
                    const char = letters[Math.floor(Math.random() * letters.length)];
                    const y = s.y - i * s.size;
                    const glow = Math.max(70, 190 - i * 5);
                    const alpha = 0.55;
                    const color = `rgba(${glow}, ${Math.floor(glow * 0.6)}, ${Math.floor(glow * 0.8)}, ${alpha})`;
                    const wave = Math.sin(timestamp * 0.0015 + s.x * 0.01) * 6;

                    ctx.fillStyle = color;
                    ctx.fillText(char, s.x + wave, y);
                }

                s.y += s.speed;
                if (s.y > HEIGHT + 300) {
                    s.y = -500 + Math.random() * 400;
                    s.x = Math.random() * WIDTH;
                }
            });
        }

        // =========================
        // 爱心函数
        // =========================
        function heartFunction(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        // 大爱心粒子
        const particles = [];
        for (let i = 0; i < 2500; i++) {
            const t = Math.random() * Math.PI * 2;
            let { x, y } = heartFunction(t);
            const thickness = 0.95 + Math.random() * 0.1;
            x *= thickness * 18;
            y *= thickness * 18;
            particles.push({ bx: x, by: y });
        }

        // 小爱心轮廓
        const smallHeartOutline = [];
        for (let i = 0; i < 628; i++) {
            const t = i * 0.01;
            let { x, y } = heartFunction(t);
            x *= 9;
            y *= 9;
            smallHeartOutline.push({ x: WIDTH / 2 + x, y: HEIGHT / 2 + y });
        }

        // =========================
        // 状态变量
        // =========================
        let countdown = 3;
        const countdownDelay = 4000;
        const startTime = performance.now();
        let lastTime = startTime;
        let countdownStarted = false;
        let numberParticles = [];
        let countExplodeParticles = [];
        let countDisappearing = false;

        const messages = [
            "妈妈，感谢有您💕",
            "愿您永远18",
            "万事如意",
            "岁岁平安",
            "心想事成",
            "母亲节快乐！"
        ];

        let currentMessage = "";
        let messageStart = 0;
        let messageIndex = 0;
        let showMessage = false;
        let finalScene = false;
        let explodeParticles = [];
        let messageDisappearing = false;

        // 创建数字点阵
        function createDotNumber(number) {
            numberParticles = [];
            const text = String(number);
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 400;
            offCanvas.height = 400;
            const offCtx = offCanvas.getContext('2d');
            offCtx.fillStyle = 'white';
            offCtx.font = 'bold 320px Arial, sans-serif';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, 200, 180);

            const imageData = offCtx.getImageData(0, 0, 400, 400);
            const offsetX = WIDTH / 2 - 200;
            const offsetY = HEIGHT / 2 - 200 - 20;

            for (let y = 0; y < 400; y += 10) {
                for (let x = 0; x < 400; x += 10) {
                    const alpha = imageData.data[(y * 400 + x) * 4 + 3];
                    if (alpha > 128) {
                        numberParticles.push({ x: offsetX + x, y: offsetY + y, r: 4 });
                    }
                }
            }
        }

        function createCountExplode() {
            countExplodeParticles = [];
            numberParticles.forEach(p => {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                countExplodeParticles.push({
                    x: p.x, y: p.y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 30 + Math.floor(Math.random() * 31)
                });
            });
        }

        function createExplodeParticles(text) {
            explodeParticles = [];
            const offCanvas = document.createElement('canvas');
            offCanvas.width = WIDTH;
            offCanvas.height = 200;
            const offCtx = offCanvas.getContext('2d');
            offCtx.fillStyle = 'white';
            offCtx.font = 'bold 95px "SimHei", "Microsoft YaHei", "PingFang SC", sans-serif';
            offCtx.textAlign = 'center';
            offCtx.textBaseline = 'middle';
            offCtx.fillText(text, WIDTH / 2, 100);

            const imageData = offCtx.getImageData(0, 0, WIDTH, 200);
            const offsetY = HEIGHT / 2 - 100;

            for (let y = 0; y < 200; y += 6) {
                for (let x = 0; x < WIDTH; x += 6) {
                    const alpha = imageData.data[(y * WIDTH + x) * 4 + 3];
                    if (alpha > 128) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = 1 + Math.random() * 5;
                        explodeParticles.push({
                            x: x, y: offsetY + y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            life: 40 + Math.floor(Math.random() * 31)
                        });
                    }
                }
            }
        }

        // 主渲染循环
        function gameLoop(timestamp) {
            ctx.fillStyle = BLACK;
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            drawMatrixRain(timestamp);

            // 大爱心呼吸动画
            const timeNow = timestamp / 1000;
            particles.forEach((p, i) => {
                const dx = p.bx;
                const dy = p.by;
                const z = Math.sin(timeNow * 2 + i * 0.03);
                const scale = 1 + z * 0.12;
                const x = WIDTH / 2 + dx * scale;
                const y = HEIGHT / 2 + dy * scale;
                const glow = Math.floor(180 + 60 * z);
                const r = Math.min(255, glow);
                const g = Math.min(255, glow + 20);
                ctx.fillStyle = `rgb(255, ${r}, ${g})`;
                ctx.beginPath();
                ctx.arc(x, y, 2, 0, Math.PI * 2);
                ctx.fill();
            });

            if (finalScene) {
                const topColor = { r: 255, g: 192, b: 203 };
                const bottomColor = { r: 255, g: 20, b: 147 };
                const minY = Math.min(...smallHeartOutline.map(p => p.y));
                const maxY = Math.max(...smallHeartOutline.map(p => p.y));
                const heartCanvas = document.createElement('canvas');
                heartCanvas.width = WIDTH;
                heartCanvas.height = HEIGHT;
                const heartCtx = heartCanvas.getContext('2d');
                for (let y = Math.floor(minY); y <= Math.ceil(maxY); y++) {
                    const ratio = (y - minY) / (maxY - minY);
                    const r = Math.floor(topColor.r * (1 - ratio) + bottomColor.r * ratio);
                    const g = Math.floor(topColor.g * (1 - ratio) + bottomColor.g * ratio);
                    const b = Math.floor(topColor.b * (1 - ratio) + bottomColor.b * ratio);
                    heartCtx.fillStyle = `rgb(${r}, ${g}, ${b})`;
                    heartCtx.fillRect(0, y, WIDTH, 1);
                }
                heartCtx.globalCompositeOperation = 'destination-in';
                heartCtx.beginPath();
                if (smallHeartOutline.length > 0) {
                    heartCtx.moveTo(smallHeartOutline[0].x, smallHeartOutline[0].y);
                    for (let i = 1; i < smallHeartOutline.length; i++) {
                        heartCtx.lineTo(smallHeartOutline[i].x, smallHeartOutline[i].y);
                    }
                    heartCtx.closePath();
                }
                heartCtx.fill();
                ctx.drawImage(heartCanvas, 0, 0);
            }

            const elapsed = timestamp - startTime;
            if (elapsed > countdownDelay && !countdownStarted) {
                createDotNumber(countdown);
                countdownStarted = true;
                lastTime = timestamp;
            }

            if (countdownStarted && countdown > 0) {
                if (timestamp - lastTime >= 1000) {
                    createCountExplode();
                    countDisappearing = true;
                    countdown--;
                    lastTime = timestamp;
                    if (countdown > 0) createDotNumber(countdown);
                }
            }

            if (countdownStarted && countdown > 0) {
                numberParticles.forEach(p => {
                    ctx.fillStyle = WHITE;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            if (countDisappearing) {
                countExplodeParticles = countExplodeParticles.filter(p => {
                    ctx.fillStyle = LIGHT_PINK;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    return p.life > 0;
                });
                if (countExplodeParticles.length === 0) countDisappearing = false;
            }

            if (countdown <= 0 && countdownStarted && !showMessage && !finalScene) {
                showMessage = true;
                messageStart = timestamp;
                currentMessage = messages[0];
                messageIndex = 0;
            }

            if (showMessage && !messageDisappearing) {
                const msgElapsed = timestamp - messageStart;
                if (msgElapsed > 3000) {
                    createExplodeParticles(currentMessage);
                    messageDisappearing = true;
                } else {
                    ctx.fillStyle = WHITE;
                    ctx.font = 'bold 95px "SimHei", "Microsoft YaHei", "PingFang SC", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(currentMessage, WIDTH / 2, HEIGHT / 2);
                }
            }

            if (messageDisappearing) {
                explodeParticles = explodeParticles.filter(p => {
                    ctx.fillStyle = 'rgb(255, 220, 230)';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                    ctx.fill();
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    return p.life > 0;
                });
                if (explodeParticles.length === 0) {
                    messageIndex++;
                    messageDisappearing = false;
                    if (messageIndex < messages.length) {
                        currentMessage = messages[messageIndex];
                        messageStart = timestamp;
                    } else {
                        showMessage = false;
                        finalScene = true;
                    }
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // =========================
        // 启动交互
        // =========================
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');
        const hintTextDiv = document.getElementById('hintText');
        const volumeControl = document.getElementById('volumeControl');
        const volumeSlider = document.getElementById('volumeSliderRange');
        const volumeIcon = document.getElementById('volumeIcon');

        let animationStarted = false;

        startBtn.addEventListener('click', () => {
            if (animationStarted) return;
            animationStarted = true;
            musicStarted = true;

            startOverlay.classList.add('hidden');
            hintTextDiv.style.display = 'block';

            setTimeout(() => {
                volumeControl.classList.add('show');
            }, 800);

            initAudio();

            requestAnimationFrame(gameLoop);

            setTimeout(() => {
                startOverlay.style.display = 'none';
            }, 1000);
        });

        volumeSlider.addEventListener('input', (e) => {
            const volume = e.target.value / 100;
            if (bgMusic) bgMusic.volume = volume;
            if (volume == 0) volumeIcon.textContent = '🔇';
            else if (volume < 0.3) volumeIcon.textContent = '🔈';
            else if (volume < 0.7) volumeIcon.textContent = '🔉';
            else volumeIcon.textContent = '🔊';
        });

        volumeIcon.addEventListener('click', () => {
            if (volumeSlider.value == 0) volumeSlider.value = 60;
            else volumeSlider.value = 0;
            volumeSlider.dispatchEvent(new Event('input'));
        });
    </script>
</body>
</html>
